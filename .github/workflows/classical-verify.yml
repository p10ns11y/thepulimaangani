# Classical-tree proofs. Kani 0.68.0 and TLA+ 1.7.4, same command as
# scripts/verify-classical-tree.sh. The main build job stays on cargo test.
name: Classical tree proofs

on:
  pull_request:
    paths:
      - tamil-seiyul-alagi/src/classical_decision.rs
      - tamil-seiyul-alagi/src/classical_tree.rs
      - tamil-seiyul-alagi/verify/**
      - tamil-seiyul-alagi/Cargo.toml
      - scripts/verify-classical-tree.sh
      - .github/workflows/classical-verify.yml
      - .cursor/skills/verify-classical-tree/**
  workflow_dispatch:

concurrency:
  group: classical-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f # v7.0.0

      - name: Rust (host for the Kani installer)
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.88.0

      - name: Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Proofs
        run: bash scripts/verify-classical-tree.sh
