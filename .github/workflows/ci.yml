# Full production path: Rust WASM (tamil-seiyul-alagi) + Vite (TanStack Start).
name: CI

on:
  push:
    branches: [malar, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@363be39a57dfa5801e05c6e0c549d622a376cf15 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.1.2+sha512.415a1cc25974731e75455c1468371be74c5aa5fb7621b50d4056d222451609f11412f23fd602e6169f1e060466641f798597e1be961a10688836a67b16569499 --activate
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Rust (wasm32)
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          targets: wasm32-unknown-unknown

      - name: Rust dependency cache
        uses: Swatinem/rust-cache@7e35be21c2b94d972b1143087fabc27d7dc881ef
        with:
          workspaces: tamil-seiyul-alagi

      - name: wasm-pack
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: wasm-pack@0.13.1

      # Same sequence as `pnpm run gate` → `scripts/ci-frontend.sh` (install → build → typecheck → wasm check → test).
      - name: Gate
        run: pnpm run gate

  # CRAP-style report: cyclomatic complexity (Lizard) × line coverage (Rust llvm-cov + Vitest v8).
  # Report-only — does not fail the workflow (see `dx/crap_report.py --max-mean` to enforce later).
  crap_analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@363be39a57dfa5801e05c6e0c549d622a376cf15 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.1.2+sha512.415a1cc25974731e75455c1468371be74c5aa5fb7621b50d4056d222451609f11412f23fd602e6169f1e060466641f798597e1be961a10688836a67b16569499 --activate
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Rust (llvm-cov + wasm32 for build:wasm)
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          components: llvm-tools-preview
          targets: wasm32-unknown-unknown

      - name: Rust dependency cache
        uses: Swatinem/rust-cache@7e35be21c2b94d972b1143087fabc27d7dc881ef
        with:
          workspaces: tamil-seiyul-alagi

      - name: wasm-pack
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: wasm-pack@0.13.1

      - name: cargo-llvm-cov
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-llvm-cov

      - name: Lizard (complexity)
        run: python3 -m pip install --break-system-packages 'lizard==1.17.19'

      - name: Build WASM (for optional Vitest integration + consistent paths)
        run: pnpm run build:wasm

      - name: Verify WASM artifact for Vitest
        run: test -f public/wasm/thepulimaangani_parser_bg.wasm

      - name: Rust tests + coverage summary (JSON)
        run: |
          cd tamil-seiyul-alagi
          cargo llvm-cov test --summary-only --json --output-path llvm-cov-summary.json

      - name: Frontend tests + coverage (json-summary)
        run: pnpm run test:frontend:coverage

      - name: Lizard XML (parser crate only)
        run: |
          lizard tamil-seiyul-alagi/src \
            --exclude tamil-seiyul-alagi/src/wasm \
            -X -o lizard-rust.xml

      - name: Merge CRAP report
        run: |
          python3 dx/crap_report.py \
            --lizard-xml lizard-rust.xml \
            --rust-cov tamil-seiyul-alagi/llvm-cov-summary.json \
            --vitest-summary coverage/coverage-summary.json \
            --out-md crap-report.md

      - name: Upload CRAP artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # latest
        with:
          name: crap-analysis
          path: |
            crap-report.md
            lizard-rust.xml
            tamil-seiyul-alagi/llvm-cov-summary.json
            coverage/coverage-summary.json
