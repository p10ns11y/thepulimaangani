# Full production path: Rust WASM (tamil-seiyul-alagi) + Vite (TanStack Start).
name: CI

on:
  push:
    branches: [malar, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm version comes only from package.json "packageManager" (no duplicate with: version:)
      - name: pnpm
        uses: pnpm/action-setup@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Rust (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tamil-seiyul-alagi

      - name: wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Build (WASM + Vite)
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test
