[package]
name = "thepulimaangani-parser"
version = "0.1.0"
edition = "2021"
authors = ["Thepulimaangani Team"]
description = "Idiomatic Rust implementation of Tamil Prosody (Yāppu) parsing logic from Avalokitam"
license = "MIT"
repository = "https://github.com/p10ns11y/thepulimaangani"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-segmentation = "1.10"
thiserror = "1.0"
regex = "1.12.3"
wasm-bindgen = "0.2"

[lib]
crate-type = ["cdylib", "rlib"]

#[dependencies]
#serde = { version = "1.0", features = ["derive"] }
#serde_json = "1.0"
# unicode-segmentation removed for Rust 1.75 compatibility (use simple chars() for now)
#regex = "1.11"
#thiserror = "1.0"

[dev-dependencies]
wasm-bindgen-test = "0.3"
csv = "1.3"
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
#serde_json = "1.0"